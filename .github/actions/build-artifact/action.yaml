name: 'Build Artifact'

description: 'Builds the plugin artifact'
inputs:
  version-number:
    description: 'The version number to use for the build'
    required: true
    default: '0.0.0'

  GCPCLIENTID:
    description: 'Google Cloud Platform Client ID for the application'
    required: true

  GDRIVEAPPID:
    description: 'Google Drive Picker App ID for the application'
    required: true

  GDRIVEFILEPICKERAPIKEY:
    description: 'Google Drive File Picker Public API Key for the application'
    required: true

  PublicClientSecret:
    description: 'Public Client Secret for the application'
    required: true

  UpdateUrlPubKey:
    description: 'Public Key for the Update URL'
    required: true


runs:
  using: "composite"
  steps:
    - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: create output directory
      shell: pwsh
      run: |
        mkdir ./out/
        mkdir ./dist/

    - name: restore sln
      shell: pwsh
      run: |
        msbuild -t:restore GoogleDriveSync.sln

    - name: publish-windows
      uses: ./.github/actions/build-single-platform
      with:
        version-number: ${{inputs.version-number}}
        keepass-location: ../lib/bin/KeePass-windows.exe
        output-name: win
        GCPCLIENTID: ${{inputs.GCPCLIENTID}}
        GDRIVEAPPID: ${{inputs.GDRIVEAPPID}}
        GDRIVEFILEPICKERAPIKEY: ${{inputs.GDRIVEFILEPICKERAPIKEY}}
        PublicClientSecret: ${{inputs.PublicClientSecret}}
        UpdateUrlPubKey: ${{inputs.UpdateUrlPubKey}}

    - name: publish-linux
      uses: ./.github/actions/build-single-platform
      with:
        version-number: ${{inputs.version-number}}
        keepass-location: ../lib/bin/KeePass-2.47-ubuntu.exe
        output-name: linux
        GCPCLIENTID: ${{inputs.GCPCLIENTID}}
        GDRIVEAPPID: ${{inputs.GDRIVEAPPID}}
        GDRIVEFILEPICKERAPIKEY: ${{inputs.GDRIVEFILEPICKERAPIKEY}}
        PublicClientSecret: ${{inputs.PublicClientSecret}}
        UpdateUrlPubKey: ${{inputs.UpdateUrlPubKey}}
