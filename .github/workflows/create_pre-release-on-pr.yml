name: Create pre-release on PR

on: pull_request


jobs:
  create-prerelease:
    runs-on: windows-latest
    permissions: 
      pull-requests: write

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
  
    - name: build artifacts
      uses: ./.github/actions/build-artifact
      with:
        GCPCLIENTID: ${{vars.GCPCLIENTID}}
        GDRIVEAPPID: ${{vars.GDRIVEAPPID}}
        GDRIVEFILEPICKERAPIKEY: ${{vars.GDRIVEFILEPICKERAPIKEY}}
        PublicClientSecret: ${{vars.PublicClientSecret}}
        UpdateUrlPubKey: ${{vars.UpdateUrlPubKey}}


    - name: List files in dist directory
      # This step is to verify that the files are created correctly
      shell: pwsh
      run: |
        [System.IO.FileSystemInfo[]]$files = Get-ChildItem ./dist/
        Write-Host "$($files.Count) files found in dist directory:"
        $files

    - name: Upload zipped Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      id: zip-upload
      with:
        name: zip-artifact
        retention-days: 15
        path: ./dist/**.zip
        if-no-files-found: error

    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ github.event.number }}
        PR_NOTES: |
          Build artifacts (expire in 15 days):
          | Name | Link |
          |------|------|
          | zip | ${{ steps.zip-upload.outputs.artifact-url }} |
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: process.env.PR_NUMBER,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: process.env.PR_NOTES
          })