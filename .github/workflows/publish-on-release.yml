name: Publish artifacts on release

on:
  release: 
    types: 
      - published

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  
    - name: build artifacts
      uses: ./.github/actions/build-artifact
      with:
        version-number: ${{ github.event.release.name }}
        GCPCLIENTID: ${{vars.GCPCLIENTID}}
        GDRIVEAPPID: ${{vars.GDRIVEAPPID}}
        GDRIVEFILEPICKERAPIKEY: ${{vars.GDRIVEFILEPICKERAPIKEY}}
        PublicClientSecret: ${{vars.PublicClientSecret}}
        UpdateUrlPubKey: ${{vars.UpdateUrlPubKey}}


    - name: List files in dist directory
      # This step is to verify that the files are created correctly
      shell: pwsh
      run: |
        [System.IO.FileSystemInfo[]]$files = Get-ChildItem ./dist/
        Write-Host "$($files.Count) files found in dist directory:"
        $files

    - name: Generate AutoUpdate file
      run: |
        "${{secrets.SIGNING_PRIVATEKEY_XML}}" | Set-Content ./lib/src/GenVerInfo/privateKey.xml -Force
        msbuild -t:publish -p:Configuration=Release ./lib/src/GenVerInfo/GenVerInfo.csproj
        & "./lib/src/GenVerInfo/bin/Release/net48/GenVerInfo.exe" "./out/win/publish/KPSyncForDrive.dll" ./dist/kpsync_final.txt

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: './dist/*'

    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs').promises;

          const files = await fs.readdir('./dist');
          for (const file of files) {
            await github.rest.repos.uploadReleaseAsset({
              name: file,
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ github.event.release.id }},
              data: await fs.readFile(`./dist/${file}`)
            });
          }
